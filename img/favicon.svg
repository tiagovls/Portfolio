<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#0a172c"/>
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="64" height="64" rx="14" fill="url(#tvGrad)"/>
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Monogram text -->
  <text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-1.5" fill="#ffffff" text-anchor="middle">TV</text>
  <!-- Modern accent dot -->
  <circle cx="50" cy="43" r="3.2" fill="#ffb830"/>
</svg>
